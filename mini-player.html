<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title></title>
<script src="sunoapp-i18n.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Inter, "SF Pro Display", "Segoe UI", sans-serif; }
  #shell {
    height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
    padding: 14px; color: #fff;
    background: linear-gradient(160deg, var(--glass, rgba(28,18,32,.78)), rgba(10,8,16,.88));
    border: 1px solid rgba(255,255,255,.16); border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.42); backdrop-filter: blur(28px) saturate(170%);
    -webkit-app-region: drag;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  header h1 { margin: 0; flex: 1; font-size: 13px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  .icon-btn {
    -webkit-app-region: no-drag; width: 32px; height: 32px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-size: 16px;
  }
  .icon-btn:hover { background: #ff5474; }
  #cover-wrap { flex: 1; min-height: 180px; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.28); }
  #cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  #meta { margin: 12px 4px 8px; -webkit-app-region: no-drag; }
  #title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #controls {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin: 6px 0 10px; -webkit-app-region: no-drag;
  }
  .ctl {
    width: 42px; height: 42px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.1); color: #fff; cursor: pointer;
    display: grid; place-items: center;
  }
  .ctl.primary { width: 52px; height: 52px; background: linear-gradient(135deg,#ff4779,#ff884d); }
  .ctl svg { width: 20px; height: 20px; fill: currentColor; }
  #panels { -webkit-app-region: no-drag; }
  #queue, #settings {
    display: none; margin-top: 8px; padding: 10px 12px; border-radius: 14px;
    background: rgba(0,0,0,.28); font-size: 12px;
  }
  #queue.open, #settings.open { display: block; }
  #queue p, #settings label { margin: 0 0 8px; color: rgba(255,255,255,.72); }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #settings input[type="range"], #settings input[type="color"] { accent-color: #ff5474; }
  #bar { display: flex; gap: 8px; -webkit-app-region: no-drag; }
  #bar button {
    flex: 1; min-height: 34px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,.1); color: #fff; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="shell">
    <header>
      <h1 data-i18n="miniPlayer">Mini-lecteur</h1>
      <button class="icon-btn" id="settingsBtn" type="button" data-i18n="miniSettings" data-i18n-attr="aria-label" aria-label="Réglages">⚙</button>
      <button class="icon-btn" id="closeBtn" type="button" data-i18n="close" data-i18n-attr="aria-label" aria-label="Fermer">×</button>
    </header>
    <div id="cover-wrap"><img id="cover" alt="" data-i18n="coverAlt" data-i18n-attr="alt"></div>
    <div id="meta">
      <div id="title"></div>
      <div id="artist"></div>
    </div>
    <div id="controls">
      <button class="ctl" id="prev" type="button" data-i18n="prev" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ctl primary" id="play" type="button" data-i18n="playPause" data-i18n-attr="title"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctl" id="next" type="button" data-i18n="next" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg></button>
      <button class="ctl" id="like" type="button" data-i18n="like" data-i18n-attr="aria-label"><svg viewBox="0 0 24 24"><path d="M12 21 3.5 12.8A5.2 5.2 0 0 1 12 6.2a5.2 5.2 0 0 1 8.5 6.6z"/></svg></button>
    </div>
    <div id="bar">
      <button id="queueBtn" type="button" data-i18n="queue">File d'attente</button>
      <button id="doneBtn" type="button" data-i18n="done">Terminé</button>
    </div>
    <div id="panels">
      <div id="queue">
        <p data-i18n="queueHint">La file d’attente reste synchronisée avec la fenêtre principale de Suno.</p>
      </div>
      <div id="settings">
        <div data-i18n="miniSettings" style="font-weight:750;margin-bottom:8px">Réglages du mini-lecteur</div>
        <label><span data-i18n="glassColor">Couleur du verre</span><input id="glassColor" type="color" value="#1c1220"></label>
        <label><span data-i18n="glassOpacity">Transparence du verre</span><input id="glassOpacity" type="range" min="0.35" max="0.92" step="0.01" value="0.78"></label>
        <label><span data-i18n="alwaysOnTop">Toujours au-dessus</span><input id="alwaysOnTop" type="checkbox" checked></label>
      </div>
    </div>
  </div>
<script>
  const i18n = window.__SUNO_I18N || { dict: { en: {}, fr: {} }, names: {}, resolve: () => 'en', t: (k) => k };
  const t = (key, vars) => i18n.t(key, vars);
  const applyI18n = () => {
    const loc = i18n.resolve();
    document.documentElement.setAttribute('lang', loc);
    document.documentElement.dir = (loc === 'ar' || loc === 'he') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const attr = el.getAttribute('data-i18n-attr');
      const value = t(el.getAttribute('data-i18n'));
      if (attr) el.setAttribute(attr, value);
      else el.textContent = value;
    });
  };
  const mini = window.sunoMini || { onState() {}, control() {} };
  const playBtn = document.getElementById('play');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  const coverEl = document.getElementById('cover');
  const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  let playing = false;
  const paintPlay = () => {
    playBtn.innerHTML = playing ? pauseIcon : playIcon;
    playBtn.setAttribute('aria-label', playing ? t('pause') : t('play'));
  };
  const applyGlass = () => {
    const color = document.getElementById('glassColor').value;
    const opacity = document.getElementById('glassOpacity').value;
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    document.getElementById('shell').style.setProperty('--glass', `rgba(${r},${g},${b},${opacity})`);
  };
  document.addEventListener('DOMContentLoaded', () => {
    applyI18n();
    titleEl.textContent = '';
    paintPlay();
    applyGlass();
    document.getElementById('closeBtn').onclick = () => mini.control('close-mini');
    document.getElementById('prev').onclick = () => mini.control('prev');
    document.getElementById('next').onclick = () => mini.control('next');
    document.getElementById('like').onclick = () => mini.control('like');
    playBtn.onclick = () => mini.control('playpause');
    document.getElementById('queueBtn').onclick = () => {
      document.getElementById('queue').classList.toggle('open');
      document.getElementById('settings').classList.remove('open');
    };
    document.getElementById('settingsBtn').onclick = () => {
      document.getElementById('settings').classList.toggle('open');
      document.getElementById('queue').classList.remove('open');
    };
    document.getElementById('doneBtn').onclick = () => {
      document.getElementById('queue').classList.remove('open');
      document.getElementById('settings').classList.remove('open');
    };
    document.getElementById('alwaysOnTop').onchange = (event) => mini.control('always-on-top', event.target.checked);
    document.getElementById('glassColor').oninput = applyGlass;
    document.getElementById('glassOpacity').oninput = applyGlass;
    if (typeof mini.onState === 'function') {
      mini.onState((state) => {
        if (!state) return;
        playing = !!state.playing;
        paintPlay();
        titleEl.textContent = state.title || '';
        artistEl.textContent = state.artist || '';
        if (state.cover) coverEl.src = state.cover;
        if (state.cover && coverEl.naturalWidth) {
          mini.control('resize-to-artwork', { width: coverEl.naturalWidth, height: coverEl.naturalHeight });
        }
      });
    }
    coverEl.addEventListener('load', () => {
      if (coverEl.naturalWidth) mini.control('resize-to-artwork', { width: coverEl.naturalWidth, height: coverEl.naturalHeight });
    });
  });
</script>
</body>
</html>
