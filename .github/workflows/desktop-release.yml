name: Desktop packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-22.04
            target: linux
          - os: macos-15
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2
      - name: UI checks
        if: runner.os != 'Linux'
        run: npx electron tests/ui-layout.electron.cjs "${{ runner.temp }}/sunoapp-ui"
      - name: Linux UI checks
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron tests/ui-layout.electron.cjs "${{ runner.temp }}/sunoapp-ui"
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/check-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*mac*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --title "SunoApp $RELEASE_TAG" --notes "Windows: installateur EXE. Linux x64: AppImage ou DEB. macOS: DMG et ZIP pour Intel (x64) et Apple Silicon (arm64). Versions non signées; macOS non notarisé. Tests automatisés sur les trois systèmes; connexion Suno et audio réel à valider sur chaque bureau." packages/*
