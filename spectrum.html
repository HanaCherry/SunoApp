<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Spectre SunoApp</title>
<script src="sunoapp-i18n.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Inter, "Segoe UI", sans-serif; }
  #wrap {
    height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(18,14,28,.92), rgba(10,8,18,.96));
    border: 1px solid rgba(255,182,193,.22);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  header {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 6px;
    color: #f8e8c7;
  }
  header h1 { font-size: 13px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  header p { margin: 0; font-size: 11px; color: rgba(255,182,193,.75); max-width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #close {
    -webkit-app-region: no-drag;
    width: 28px; height: 28px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-size: 16px;
  }
  #close:hover { background: #ff5474; }
  canvas { display: block; width: calc(100% - 20px); height: calc(100% - 48px); margin: 0 10px 10px; }
</style>
</head>
<body>
  <div id="wrap">
    <header>
      <h1 id="title" data-i18n="spectrum">Spectre</h1>
      <p id="artist"></p>
      <button id="close" type="button" aria-label="Fermer" data-i18n="close" data-i18n-attr="aria-label">×</button>
    </header>
    <canvas id="viz"></canvas>
  </div>
<script>
  const i18n = window.__SUNO_I18N || { resolve: () => 'en', t: (k) => k };
  const t = (key) => i18n.t(key);
  const loc = i18n.resolve();
  document.documentElement.setAttribute('lang', loc);
  document.documentElement.dir = (loc === 'ar' || loc === 'he') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const attr = el.getAttribute('data-i18n-attr');
    const value = t(el.getAttribute('data-i18n'));
    if (attr) el.setAttribute(attr, value);
    else el.textContent = value;
  });
  document.title = t('spectrum');
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  let bins = [];
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.max(320, Math.floor(r.width * devicePixelRatio));
    canvas.height = Math.max(120, Math.floor(r.height * devicePixelRatio));
  };
  window.addEventListener('resize', fit);
  fit();
  document.getElementById('close').onclick = () => window.sunoSpectrum.close();
  window.sunoSpectrum.onData((data) => {
    if (!data) return;
    if (Array.isArray(data)) bins = data;
    else {
      bins = data.bins || [];
      titleEl.textContent = data.title || t('spectrum');
      if (data.artist) artistEl.textContent = data.artist;
    }
  });
  const draw = () => {
    requestAnimationFrame(draw);
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const n = Math.max(bins.length, 64);
    const barW = w / n;
    const mid = h * 0.72;
    for (let i = 0; i < n; i++) {
      const v = (bins[i] || 0) / 255;
      const bh = Math.max(2 * devicePixelRatio, v * mid);
      ctx.fillStyle = `hsla(${328 - i * 2.1}, 88%, ${56 + v * 22}%, .95)`;
      ctx.fillRect(i * barW + 1, mid - bh, Math.max(1, barW - 2), bh);
      ctx.fillStyle = `hsla(${328 - i * 2.1}, 80%, 62%, .28)`;
      ctx.fillRect(i * barW + 1, mid + 2, Math.max(1, barW - 2), bh * .38);
    }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(0, mid, w, 1);
  };
  draw();
</script>
</body>
</html>
